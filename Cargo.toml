[workspace]

[package]
name = "miniide"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "MiniIDE - IDE minimalista para Windows implementado en Rust"
publish = false

[lib]
name = "miniide"
path = "src/lib.rs"

[[bin]]
name = "miniide"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
# El stack de la interfaz, decidido en `docs/frontend-plan.md` (FD-01): egui para
# los widgets y eframe para la ventana. Solo se pide lo que hace falta en Windows,
# con el renderizador de OpenGL y las fuentes incluidas; los backends de Linux y el
# lector de pantalla web se dejan fuera porque aqui no se usan.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
# El logo de la ventana. `image` decodifica el PNG del logo; solo trae el formato
# PNG, y con los mismos features que ya usan las dependencias de eframe, asi que no
# se compila nada que no estuviera compilado.
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
# Incrusta el icono en el ejecutable. `winresource` es Rust puro y no necesita el
# SDK de Windows.
winresource = "0.1"

[dev-dependencies]
